version: 2

models:
  - name: rpt_sales_performance
    description: >
      Sales performance report with quota attainment analysis.
      Grain: one row per rep + product + territory + month.
      Joins fct_sales and fct_sales_target with all relevant dimensions.
      Key KPIs: revenue_attainment_pct, units_attainment_pct, attainment_band.
    columns:
      - name: performance_sk
        description: "Surrogate key (rep + product + territory + year_month)"
        tests: [not_null, unique]
      - name: year_month
        tests: [not_null]
      - name: rep_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_sales_rep')
              field: rep_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: territory_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_territory')
              field: territory_id
      - name: total_net_revenue
        description: "Sum of net_amount for the month"
        tests: [not_null]
      - name: revenue_attainment_pct
        description: "Net revenue / target * 100. NULL if no target set."
      - name: attainment_band
        description: "Performance classification"
        tests:
          - accepted_values:
              values: ['Exceeds (120%+)', 'On Target (100-120%)', 'Below (80-100%)', 'At Risk (<80%)', 'No Target']
